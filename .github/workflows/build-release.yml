name: Build and Release P4-CAN Chinese Firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ESP32-P4 Firmware (p4canC · 中文仪表盘)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI 1.6.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_1.6.0_Linux_64bit.tar.gz \
            -o /tmp/arduino-cli.tar.gz
          tar -xzf /tmp/arduino-cli.tar.gz -C "$HOME/.local/bin" arduino-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/arduino-cli" version

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Regenerate embedded dashboard header & run host checks
        run: |
          python3 tools/build_dashboard.py
          node tests/test_dashboard.js
          python3 tests/test_p4_tinycrypt_host.py
          python3 tests/test_p4_crypto_lifecycle.py
          python3 tests/test_p4_crypto_link.py

      - name: Stage Arduino sketch
        run: |
          mkdir -p "$RUNNER_TEMP/sketch/P4-CAN-Universal-v3.29.3"
          cp -R *.h *.ino src third_party "$RUNNER_TEMP/sketch/P4-CAN-Universal-v3.29.3/"
          ls -la "$RUNNER_TEMP/sketch/P4-CAN-Universal-v3.29.3"

      - name: Compile ESP32-P4 Firmware
        run: |
          mkdir -p dist
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32p4:ChipVariant=postv3,FlashSize=32M,PartitionScheme=app5M_fat24M_32MB,PSRAM=enabled,USBMode=hwcdc,CDCOnBoot=cdc,FlashMode=qio" \
            --output-dir dist "$RUNNER_TEMP/sketch/P4-CAN-Universal-v3.29.3"
          ls -lh dist

      - name: Verify P4 TinyCrypt ECC Link
        run: |
          python3 tools/verify_p4_crypto.py --elf dist/P4-CAN-Universal-v3.29.3.ino.elf

      - name: Rename release assets and checksums
        run: |
          cd dist
          cp "P4-CAN-Universal-v3.29.3.ino.bin" \
             "P4-CAN-Universal-v3.29.3-zh-p4canC.OTA.bin"
          cp "P4-CAN-Universal-v3.29.3.ino.merged.bin" \
             "P4-CAN-Universal-v3.29.3-zh-p4canC.fullflash.bin"
          sha256sum P4-CAN-Universal-v3.29.3-zh-p4canC.OTA.bin \
                    P4-CAN-Universal-v3.29.3-zh-p4canC.fullflash.bin \
                    > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: P4-CAN-Universal-v3.29.3-zh-p4canC
          path: |
            dist/P4-CAN-Universal-v3.29.3-zh-p4canC.OTA.bin
            dist/P4-CAN-Universal-v3.29.3-zh-p4canC.fullflash.bin
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: P4-CAN Universal v3.29.3 中文定制版 (${{ github.ref_name }})
          body_path: .github/release-notes.md
          files: |
            dist/P4-CAN-Universal-v3.29.3-zh-p4canC.OTA.bin
            dist/P4-CAN-Universal-v3.29.3-zh-p4canC.fullflash.bin
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
