name: Build and Release P4-CAN v3.35.2 Chinese Firmware

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ESP32-P4 Firmware (P4-CAN-Universal-v3.35.2 · zh-CN · p4canC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI 1.6.0
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_1.6.0_Linux_64bit.tar.gz -o /tmp/arduino-cli.tar.gz
          tar -xzf /tmp/arduino-cli.tar.gz -C "$HOME/.local/bin" arduino-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core 3.3.12
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12

      - name: Rebuild embedded dashboard
        run: |
          if [ -f tools/build_dashboard.py ]; then python3 tools/build_dashboard.py; fi

      - name: Stage Arduino sketch
        run: |
          mkdir -p "$RUNNER_TEMP/sketch/P4-CAN-Universal-v3.35.2"
          cp *.h *.ino "$RUNNER_TEMP/sketch/P4-CAN-Universal-v3.35.2/"
          cp *.c "$RUNNER_TEMP/sketch/P4-CAN-Universal-v3.35.2/" 2>/dev/null || true
          for d in src third_party automatic_shift vendor; do
            if [ -d "$d" ]; then cp -R "$d" "$RUNNER_TEMP/sketch/P4-CAN-Universal-v3.35.2/"; fi
          done
          ls -la "$RUNNER_TEMP/sketch/P4-CAN-Universal-v3.35.2"

      - name: Compile ESP32-P4 Firmware (postv3 · app5M OTA compatible)
        run: |
          mkdir -p dist
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32p4:ChipVariant=postv3,FlashSize=32M,PartitionScheme=app5M_fat24M_32MB,PSRAM=enabled,USBMode=hwcdc,CDCOnBoot=cdc,FlashMode=qio" \
            --output-dir dist "$RUNNER_TEMP/sketch/P4-CAN-Universal-v3.35.2"
          ls -lh dist

      - name: Rename release assets and checksums
        run: |
          cd dist
          cp "P4-CAN-Universal-v3.35.2.ino.bin" "P4-CAN-Universal-v3.35.2-zh-p4canC.OTA.bin"
          cp "P4-CAN-Universal-v3.35.2.ino.merged.bin" "P4-CAN-Universal-v3.35.2-zh-p4canC.fullflash.bin"
          sha256sum "P4-CAN-Universal-v3.35.2-zh-p4canC.OTA.bin" "P4-CAN-Universal-v3.35.2-zh-p4canC.fullflash.bin" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: P4-CAN-Universal-v3.35.2-zh-p4canC
          path: |
            dist/P4-CAN-Universal-v3.35.2-zh-p4canC.OTA.bin
            dist/P4-CAN-Universal-v3.35.2-zh-p4canC.fullflash.bin
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "P4-CAN-Universal-v3.35.2 官方中文定制版 (${{ github.ref_name }})"
          files: |
            dist/P4-CAN-Universal-v3.35.2-zh-p4canC.OTA.bin
            dist/P4-CAN-Universal-v3.35.2-zh-p4canC.fullflash.bin
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
